        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serverId:
                  anyOf:
                  - type: string
                  - type: 'null'
                authDomain:
                  type: string
                https:
                  default: true
                  type: boolean
                certificateType:
                  default: letsencrypt
                  type: string
                  enum:
                  - none
                  - letsencrypt
                  - custom
                customCertResolver:
                  type: string
              required:
              - serverId
              - authDomain
      responses:
        '200':
          description: Successful response
