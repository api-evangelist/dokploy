        name: volumeName
        schema:
          type: string
          minLength: 1
          pattern: ^[a-zA-Z0-9.\-_]+$
        required: true
      - in: query
        name: path
        schema:
          type: string
          minLength: 1
          maxLength: 4096
        required: true
      - in: query
        name: serverId
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
