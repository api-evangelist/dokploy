      tags:
      - dockerVolume
      security:
      - x-api-key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                volumeName:
                  type: string
                  minLength: 1
                  pattern: ^[a-zA-Z0-9.\-_]+$
                path:
                  type: string
                  minLength: 1
                  maxLength: 4096
                content:
                  type: string
                serverId:
                  type: string
              required:
              - volumeName
              - path
              - content
      responses:
        '200':
          description: Successful response
          content:
            application/json:
