        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
      summary: Docker volume read volume file
      x-summary-source: derived
  /dockerVolume.writeVolumeFile:
