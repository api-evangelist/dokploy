      summary: Network one
      x-summary-source: derived
  /network.create:
    post:
      operationId: network-create
      tags:
      - Network
      security:
      - x-api-key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                driver:
                  type: string
                  enum:
                  - bridge
                  - overlay
                internal:
                  type: boolean
                attachable:
                  type: boolean
                enableIPv4:
                  type: boolean
                enableIPv6:
                  type: boolean
                mtu:
                  anyOf:
                  - anyOf:
                    - type: integer
                      minimum: 68
                      maximum: 65535
                    - type: 'null'
                  - type: 'null'
                ipam:
                  anyOf:
                  - type: object
                    properties:
                      driver:
                        type: string
                      config:
                        type: array
                        items:
                          type: object
                          properties:
                            subnet:
                              type: string
                            gateway:
                              type: string
                            ipRange:
                              type: string
                  - type: 'null'
                serverId:
                  anyOf:
                  - anyOf:
                    - type: string
                    - type: 'null'
                  - type: 'null'
              required:
              - name
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
      summary: Network create
      x-summary-source: derived
