      security:
      - x-api-key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serverId:
                  type: string
                names:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    minLength: 1
              required:
